<div *ngIf="view === ''" class="page">
  <div class="page-head">
    <div class="page-heading">
      <span class="page-eyebrow">Tackle box</span>
      <h1 class="page-title">{{ '::Menu:Methods' | abpLocalization }}</h1>
      <p class="page-subtitle">How you're presenting it.</p>
    </div>
    <div class="page-actions">
      <button id="create" class="btn btn-primary" type="button" (click)="createMethod()">
        <i class="fa fa-plus me-1"></i>
        <span>{{ "::NewMethod" | abpLocalization }}</span>
      </button>
    </div>
  </div>

  <div class="entity-row-list">
    <article *ngFor="let row of method.items" class="entity-row">
      <div class="entity-row-body">
        <h2 class="entity-row-title">{{ row.name }}</h2>
      </div>
      <div class="entity-row-actions">
        <button class="icon-btn" [title]="'::Edit' | abpLocalization" (click)="editMethod(row.id)">
          <i class="fa fa-pencil"></i>
        </button>
        <button class="icon-btn icon-btn-danger" [title]="'::Delete' | abpLocalization" (click)="deleteMethod(row.id)">
          <i class="fa fa-trash"></i>
        </button>
      </div>
    </article>

    <div *ngIf="method.items.length === 0" class="empty-state">
      <i class="fa fa-cog empty-state-icon"></i>
      <h2 class="empty-state-title">No methods yet</h2>
      <p class="empty-state-text">Float, feeder, lure, ledger - record how you fish so you can compare what works.</p>
      <button class="btn btn-primary" type="button" (click)="createMethod()">
        <i class="fa fa-plus me-1"></i> Add your first method
      </button>
    </div>
  </div>
</div>

<div *ngIf="view === 'methodForm'" class="page">
  <div class="page-head">
    <div class="page-heading">
      <span class="page-eyebrow">Method</span>
      <h1 class="page-title">{{ (methodItem ? '::EditMethod' : '::NewMethod') | abpLocalization }}</h1>
    </div>
  </div>

  <div class="panel">
    <div class="panel-body">
      <app-method-form #methodFormRef [method]="methodItem" (saved)="onMethodSaved()" (cancelled)="closeMethodForm()"></app-method-form>
    </div>

    <div class="panel-foot">
      <button type="button" class="btn btn-secondary" (click)="closeMethodForm()">
        {{ '::Close' | abpLocalization }}
      </button>
      <button class="btn btn-primary" (click)="methodFormRef.save()" [disabled]="methodFormRef.form?.invalid">
        <i class="fa fa-check me-1"></i>
        {{ '::Save' | abpLocalization }}
      </button>
    </div>
  </div>
</div>
