<app-page-topbar-nav></app-page-topbar-nav>

<div *ngIf="view === ''" class="card mg-3">
  <div class="card-header">
    <div class="row">
      <div class="col col-md-6">
        <h5 class="card-title">{{ '::Menu:Venues' | abpLocalization }}</h5>
      </div>
      <div class="text-lg-end pt-2">
        <button id="create" class="btn btn-primary" type="button" (click)="createVenue()">
          <i class="fa fa-plus me-1"></i>
          <span>{{ "::NewVenue" | abpLocalization }}</span>
        </button>
      </div>
    </div>
  </div>
  <div class="card-body">
    <ngx-datatable [rows]="venue.items" [count]="venue.totalCount" [list]="list" default>
      <ngx-datatable-column [name]="'::Actions' | abpLocalization" [maxWidth]="150" [sortable]="false">
        <ng-template let-row="row" ngx-datatable-cell-template>
          <div ngbDropdown container="body" class="d-inline-block">
            <button class="btn btn-primary btn-sm dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" ngbDropdownToggle>
              <i class="fa fa-cog me-1"></i>{{ '::Actions' | abpLocalization }}
            </button>
            <div ngbDropdownMenu>
              <button ngbDropdownItem (click)="editVenue(row.id)">{{ '::Edit' | abpLocalization }}</button>
              <button ngbDropdownItem (click)="deleteVenue(row.id)">{{ '::Delete' | abpLocalization }}</button>
            </div>
          </div>
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column [name]="'::Name' | abpLocalization" prop="name"></ngx-datatable-column>
      <ngx-datatable-column [name]="'::Postcode' | abpLocalization" prop="postcode"></ngx-datatable-column>
      <ngx-datatable-column [name]="'::Ticket' | abpLocalization" prop="ticketName"></ngx-datatable-column>
    </ngx-datatable>
  </div>
</div>

<div *ngIf="view === 'venueForm'" class="card mg-3">
  <div class="card-header">
    <h3>{{ (venueItem ? '::EditVenue' : '::NewVenue') | abpLocalization }}</h3>
  </div>

  <div class="card-body">
    <form *ngIf="venueForm" [formGroup]="venueForm">
      <div>
        <label for="venue-name">Name</label><span> * </span>
        <input type="text" id="venue-name" class="form-control" formControlName="name" autofocus />
      </div>
      <div class="mt-2">
        <label for="venue-postcode">Postcode</label>
        <input type="text" id="venue-postcode" class="form-control" formControlName="postcode" />
      </div>
      <div class="mt-2">
        <label for="venue-ticket">Ticket / club membership required</label>
        <select class="form-control" id="venue-ticket" formControlName="ticketId">
          <option [ngValue]="null">None</option>
          <option [ngValue]="ticket.id" *ngFor="let ticket of ticketList">{{ ticket.name }}</option>
        </select>
        <small class="text-muted" *ngIf="ticketList.length === 0">
          No tickets yet - <a [routerLink]="['/tickets']">add one</a> if this venue needs one.
        </small>
      </div>
    </form>
  </div>

  <div class="card-footer">
    <button type="button" class="btn btn-secondary button-pad" (click)="closeVenueForm()">
      {{ '::Close' | abpLocalization }}
    </button>
    <button class="btn btn-primary" (click)="saveVenue()" [disabled]="venueForm.invalid">
      <i class="fa fa-check mr-1"></i>
      {{ '::Save' | abpLocalization }}
    </button>
  </div>
</div>
